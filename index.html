<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UongoZi — Civic Education Platform</title>
  <meta name="description" content="UongoZi — Learn and test your knowledge of the Kenya Constitution 2010. Civic education made engaging." />

  <!-- Preconnect to speed up Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Non-blocking font load: fonts load after page renders -->
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Inline critical style: prevent white flash before React mounts -->
  <style>
    html, body, #root {
      margin: 0; padding: 0;
      background: #061e16;
      min-height: 100vh;
    }
    #app-loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #061e16;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #app-loading .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(201,168,76,0.2);
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <!-- Instant loading indicator shown before React boots -->
  <div id="app-loading"><div class="spinner"></div></div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
